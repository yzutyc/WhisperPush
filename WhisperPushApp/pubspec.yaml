name: whisperpushapp
description: "WhisperPush - Secure Push Notifications"
publish_to: 'none'

version: 0.1.3+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  shared_preferences: ^2.2.2
  http: ^1.2.1
  flutter_html: ^3.0.0-beta.2
  flutter_markdown: ^0.6.18
  intl: ^0.18.1
  share_plus: ^7.2.1
  package_info_plus: ^4.0.0
  window_manager: ^0.4.3
  qr_flutter: ^4.1.0
  url_launcher: ^6.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  web: true
  windows: true
  macos: true
  image_path: "assets/logo.svg"
  adaptive_icon_background: "#8B5CF6"
  adaptive_icon_foreground: "assets/logo.svg"

flutter:
  uses-material-design: true
  assets:
    - assets/
