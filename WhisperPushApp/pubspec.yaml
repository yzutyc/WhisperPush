name: whisperpushapp
description: "WhisperPush - Secure Push Notifications"
publish_to: 'none'

version: 0.2.6+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  http: ^1.2.1
  flutter_html: ^3.0.0-beta.2
  flutter_markdown: ^0.7.6
  intl: ^0.20.2
  share_plus: ^13.1.0
  package_info_plus: ^10.1.0
  window_manager: ^0.5.1
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.1
  device_info_plus: ^10.1.0
  huawei_push: ^6.12.0+300

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  macos:
    generate: true
    image_path: "assets/logo.png"
  web:
    generate: true
    image_path: "assets/logo.png"
    background_color: "#8B5CF6"
    theme_color: "#8B5CF6"
  windows:
    generate: true
    image_path: "assets/logo.png"
  image_path: "assets/logo.png"
  adaptive_icon_background: "#8B5CF6"
  adaptive_icon_foreground: "assets/logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/
