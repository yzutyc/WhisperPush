name: Deploy to Production

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      reason:
        description: 'Deploy reason'
        required: false
        default: 'Manual deployment'

env:
  APP_NAME: whisperpush-server
  INSTALL_DIR: /opt/whisperpush-server
  SERVICE_USER: whisperpush
  SERVICE_GROUP: whisperpush

jobs:
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy to Server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          APP_NAME: ${{ env.APP_NAME }}
          INSTALL_DIR: ${{ env.INSTALL_DIR }}
          SERVICE_USER: ${{ env.SERVICE_USER }}
          SERVICE_GROUP: ${{ env.SERVICE_GROUP }}
        run: |
          ssh -o StrictHostKeyChecking=no ${SERVER_USER}@${SERVER_HOST} \
            APP_NAME="${APP_NAME}" \
            INSTALL_DIR="${INSTALL_DIR}" \
            SERVICE_USER="${SERVICE_USER}" \
            SERVICE_GROUP="${SERVICE_GROUP}" \
            GITHUB_REPOSITORY="${GITHUB_REPOSITORY}" \
            GITHUB_REF_NAME="${GITHUB_REF_NAME}" \
            DATABASE_URL="${DATABASE_URL}" \
            SECRET_KEY="${SECRET_KEY}" \
            JWT_SECRET_KEY="${JWT_SECRET_KEY}" \
            SMTP_SERVER="${SMTP_SERVER}" \
            SMTP_PORT="${SMTP_PORT}" \
            SMTP_USERNAME="${SMTP_USERNAME}" \
            SMTP_PASSWORD="${SMTP_PASSWORD}" \
            EMAIL_FROM="${EMAIL_FROM}" \
            bash -s < WhisperPushServer/scripts/deploy.sh
