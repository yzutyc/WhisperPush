name: Build All Platforms

permissions:
  contents: write

on:
  push:
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    name: Build Android

    steps:
    - uses: actions/checkout@v4

    - name: Get version
      id: version
      run: |
        VERSION=$(grep '^version:' WhisperPushApp/pubspec.yaml | head -1 | sed -E 's/version:\s*([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.41.9'

    - name: Get dependencies
      working-directory: ./WhisperPushApp
      run: flutter pub get

    - name: Build APK
      working-directory: ./WhisperPushApp
      run: flutter build apk --release

    - name: Build App Bundle
      working-directory: ./WhisperPushApp
      run: flutter build appbundle

    - name: Rename artifacts with version
      run: |
        cp WhisperPushApp/build/app/outputs/flutter-apk/app-release.apk \
           WhisperPush-v${{ steps.version.outputs.version }}-android.apk
        cp WhisperPushApp/build/app/outputs/bundle/release/app-release.aab \
           WhisperPush-v${{ steps.version.outputs.version }}-android.aab

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: WhisperPush-v${{ steps.version.outputs.version }}-android
        path: |
          WhisperPush-v${{ steps.version.outputs.version }}-android.apk
          WhisperPush-v${{ steps.version.outputs.version }}-android.aab

    - name: Upload to Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        generate_release_notes: true
        files: |
          WhisperPush-v${{ steps.version.outputs.version }}-android.apk
          WhisperPush-v${{ steps.version.outputs.version }}-android.aab
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-ios:
    runs-on: macos-latest
    name: Build iOS

    steps:
    - uses: actions/checkout@v4

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.41.9'
        architecture: x64

    - name: Get dependencies
      working-directory: ./WhisperPushApp
      run: flutter pub get

    - name: Build iOS Simulator Build (without code signing)
      working-directory: ./WhisperPushApp
      run: flutter build ios --simulator --no-codesign

    - name: Upload iOS artifact
      uses: actions/upload-artifact@v4
      with:
        name: ios-app
        path: WhisperPushApp/build/ios/iphonesimulator/Runner.app

  build-windows:
    runs-on: windows-latest
    name: Build Windows

    steps:
    - uses: actions/checkout@v4

    - name: Get version
      id: version
      shell: pwsh
      run: |
        $content = Get-Content WhisperPushApp/pubspec.yaml | Select-String '^version:'
        $version = ($content -replace 'version:\s*([0-9]+\.[0-9]+\.[0-9]+).*', '$1').Trim()
        echo "version=$version" >> $env:GITHUB_OUTPUT

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.41.9'

    - name: Get dependencies
      working-directory: ./WhisperPushApp
      run: flutter pub get

    - name: Build Windows
      working-directory: ./WhisperPushApp
      run: flutter build windows --release

    - name: Package Windows build
      run: |
        $pkg = "WhisperPush-v${{ steps.version.outputs.version }}-windows-x64.zip"
        Compress-Archive -Path WhisperPushApp/build/windows/x64/runner/Release/* -DestinationPath $pkg

    - name: Upload Windows artifact
      uses: actions/upload-artifact@v4
      with:
        name: WhisperPush-v${{ steps.version.outputs.version }}-windows
        path: WhisperPush-v${{ steps.version.outputs.version }}-windows-x64.zip

    - name: Upload to Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: WhisperPush-v${{ steps.version.outputs.version }}-windows-x64.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    runs-on: ubuntu-latest
    name: Build Linux

    steps:
    - uses: actions/checkout@v4

    - name: Get version
      id: version
      run: |
        VERSION=$(grep '^version:' WhisperPushApp/pubspec.yaml | head -1 | sed -E 's/version:\s*([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Install Linux dependencies
      run: |
        sudo apt-get update -y
        sudo apt-get install -y \
          clang cmake git ninja-build pkg-config \
          libgtk-3-dev liblzma-dev libstdc++-12-dev

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.41.9'

    - name: Get dependencies
      working-directory: ./WhisperPushApp
      run: flutter pub get

    - name: Build Linux
      working-directory: ./WhisperPushApp
      run: flutter build linux --release

    - name: Package Linux build
      run: |
        tar czf WhisperPush-v${{ steps.version.outputs.version }}-linux-x64.tar.gz \
          -C WhisperPushApp/build/linux/x64/release/bundle .

    - name: Upload Linux artifact
      uses: actions/upload-artifact@v4
      with:
        name: WhisperPush-v${{ steps.version.outputs.version }}-linux
        path: WhisperPush-v${{ steps.version.outputs.version }}-linux-x64.tar.gz

    - name: Upload to Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: WhisperPush-v${{ steps.version.outputs.version }}-linux-x64.tar.gz
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    runs-on: macos-latest
    name: Build macOS

    steps:
    - uses: actions/checkout@v4

    - name: Get version
      id: version
      run: |
        VERSION=$(grep '^version:' WhisperPushApp/pubspec.yaml | head -1 | sed -E 's/version:\s*([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.41.9'
        architecture: x64

    - name: Get dependencies
      working-directory: ./WhisperPushApp
      run: flutter pub get

    - name: Build macOS
      working-directory: ./WhisperPushApp
      run: flutter build macos --release

    - name: Package macOS build
      run: |
        tar czf WhisperPush-v${{ steps.version.outputs.version }}-macos-x64.tar.gz \
          -C WhisperPushApp/build/macos/Build/Products/Release .

    - name: Upload macOS artifact
      uses: actions/upload-artifact@v4
      with:
        name: WhisperPush-v${{ steps.version.outputs.version }}-macos
        path: WhisperPush-v${{ steps.version.outputs.version }}-macos-x64.tar.gz

    - name: Upload to Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: WhisperPush-v${{ steps.version.outputs.version }}-macos-x64.tar.gz
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-web:
    runs-on: ubuntu-latest
    name: Build Web

    steps:
    - uses: actions/checkout@v4

    - name: Get version
      id: version
      run: |
        VERSION=$(grep '^version:' WhisperPushApp/pubspec.yaml | head -1 | sed -E 's/version:\s*([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.41.9'

    - name: Get dependencies
      working-directory: ./WhisperPushApp
      run: flutter pub get

    - name: Build Web
      working-directory: ./WhisperPushApp
      run: flutter build web --release

    - name: Package Web build
      run: |
        tar czf WhisperPush-v${{ steps.version.outputs.version }}-web.tar.gz \
          -C WhisperPushApp/build/web .

    - name: Upload Web artifact
      uses: actions/upload-artifact@v4
      with:
        name: WhisperPush-v${{ steps.version.outputs.version }}-web
        path: WhisperPush-v${{ steps.version.outputs.version }}-web.tar.gz

    - name: Upload to Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: WhisperPush-v${{ steps.version.outputs.version }}-web.tar.gz
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
