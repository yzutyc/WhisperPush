name: Build All Platforms

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    name: Build Android

    steps:
    - uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.41.9'

    - name: Get dependencies
      working-directory: ./WhisperPushApp
      run: flutter pub get

    - name: Build APK
      working-directory: ./WhisperPushApp
      run: flutter build apk --release

    - name: Build App Bundle
      working-directory: ./WhisperPushApp
      run: flutter build appbundle

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: android-app-release
        path: WhisperPushApp/build/app/outputs/flutter-apk/app-release.apk

    - name: Upload App Bundle artifact
      uses: actions/upload-artifact@v4
      with:
        name: android-app-bundle
        path: WhisperPushApp/build/app/outputs/bundle/release/app-release.aab

    - name: Upload to Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          WhisperPushApp/build/app/outputs/flutter-apk/app-release.apk
          WhisperPushApp/build/app/outputs/bundle/release/app-release.aab
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-ios:
    runs-on: macos-latest
    name: Build iOS

    steps:
    - uses: actions/checkout@v4

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.41.9'
        architecture: x64

    - name: Get dependencies
      working-directory: ./WhisperPushApp
      run: flutter pub get

    - name: Build iOS Simulator Build (without code signing)
      working-directory: ./WhisperPushApp
      run: flutter build ios --simulator --no-codesign

    - name: Upload iOS artifact
      uses: actions/upload-artifact@v4
      with:
        name: ios-app
        path: WhisperPushApp/build/ios/iphonesimulator/Runner.app

  build-windows:
    runs-on: windows-latest
    name: Build Windows

    steps:
    - uses: actions/checkout@v4

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.41.9'

    - name: Get dependencies
      working-directory: ./WhisperPushApp
      run: flutter pub get

    - name: Build Windows
      working-directory: ./WhisperPushApp
      run: flutter build windows --release

    - name: Package Windows build
      working-directory: WhisperPushApp/build/windows/x64/runner/Release
      run: Compress-Archive -Path * -DestinationPath ${{ github.workspace }}/WhisperPush-windows-x64.zip

    - name: Upload Windows artifact
      uses: actions/upload-artifact@v4
      with:
        name: windows-app
        path: WhisperPush-windows-x64.zip

    - name: Upload to Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: WhisperPush-windows-x64.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    runs-on: ubuntu-latest
    name: Build Linux

    steps:
    - uses: actions/checkout@v4

    - name: Install Linux dependencies
      run: |
        sudo apt-get update -y
        sudo apt-get install -y \
          clang cmake git ninja-build pkg-config \
          libgtk-3-dev liblzma-dev libstdc++-12-dev

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.41.9'

    - name: Get dependencies
      working-directory: ./WhisperPushApp
      run: flutter pub get

    - name: Build Linux
      working-directory: ./WhisperPushApp
      run: flutter build linux --release

    - name: Package Linux build
      working-directory: WhisperPushApp/build/linux/x64/release/bundle
      run: tar czf ${{ github.workspace }}/WhisperPush-linux-x64.tar.gz .

    - name: Upload Linux artifact
      uses: actions/upload-artifact@v4
      with:
        name: linux-app
        path: WhisperPush-linux-x64.tar.gz

    - name: Upload to Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: WhisperPush-linux-x64.tar.gz
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    runs-on: macos-latest
    name: Build macOS

    steps:
    - uses: actions/checkout@v4

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.41.9'
        architecture: x64

    - name: Get dependencies
      working-directory: ./WhisperPushApp
      run: flutter pub get

    - name: Build macOS
      working-directory: ./WhisperPushApp
      run: flutter build macos --release

    - name: Package macOS build
      working-directory: WhisperPushApp/build/macos/Build/Products/Release
      run: tar czf ${{ github.workspace }}/WhisperPush-macos-x64.tar.gz .

    - name: Upload macOS artifact
      uses: actions/upload-artifact@v4
      with:
        name: macos-app
        path: WhisperPush-macos-x64.tar.gz

    - name: Upload to Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: WhisperPush-macos-x64.tar.gz
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-web:
    runs-on: ubuntu-latest
    name: Build Web

    steps:
    - uses: actions/checkout@v4

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.41.9'

    - name: Get dependencies
      working-directory: ./WhisperPushApp
      run: flutter pub get

    - name: Build Web
      working-directory: ./WhisperPushApp
      run: flutter build web --release

    - name: Package Web build
      working-directory: WhisperPushApp/build/web
      run: tar czf ${{ github.workspace }}/WhisperPush-web.tar.gz .

    - name: Upload Web artifact
      uses: actions/upload-artifact@v4
      with:
        name: web-app
        path: WhisperPush-web.tar.gz

    - name: Upload to Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: WhisperPush-web.tar.gz
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
