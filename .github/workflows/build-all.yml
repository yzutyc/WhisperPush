name: Build All Platforms

permissions:
  contents: write

on:
  push:
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    name: Build Android

    steps:
    - uses: actions/checkout@v4

    - name: Get version
      id: version
      run: |
        VERSION=$(grep '^version:' WhisperPushApp/pubspec.yaml | head -1 | sed 's/version: *//' | sed 's/+.*//')
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.41.9'
        cache: true

    - name: Get dependencies
      working-directory: ./WhisperPushApp
      run: flutter pub get

    - name: Decode Android Keystore
      if: startsWith(github.ref, 'refs/tags/')
      env:
        ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_JKS }}
      run: |
        echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > WhisperPushApp/android/app/whisperpush-release-key.jks

    - name: Setup Android Signing Properties
      if: startsWith(github.ref, 'refs/tags/')
      env:
        RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
        RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
      run: |
        echo "RELEASE_STORE_FILE=whisperpush-release-key.jks" > WhisperPushApp/android/local.properties
        echo "RELEASE_STORE_PASSWORD=$RELEASE_STORE_PASSWORD" >> WhisperPushApp/android/local.properties
        echo "RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS" >> WhisperPushApp/android/local.properties
        echo "RELEASE_KEY_PASSWORD=$RELEASE_KEY_PASSWORD" >> WhisperPushApp/android/local.properties

    - name: Build APK
      working-directory: ./WhisperPushApp
      run: flutter build apk --release

    - name: Build App Bundle
      working-directory: ./WhisperPushApp
      run: flutter build appbundle

    - name: Rename artifacts with version
      run: |
        mkdir -p dist
        cp WhisperPushApp/build/app/outputs/flutter-apk/app-release.apk \
           dist/WhisperPush-v${{ steps.version.outputs.version }}-android.apk
        cp WhisperPushApp/build/app/outputs/bundle/release/app-release.aab \
           dist/WhisperPush-v${{ steps.version.outputs.version }}-android.aab

    - name: Upload to Pgyer
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        curl -X POST "https://www.pgyer.com/apiv2/app/upload" \
          -F "file=@dist/WhisperPush-v${{ steps.version.outputs.version }}-android.apk" \
          -F "_api_key=${{ secrets.PGYER_API_KEY }}" \
          -F "buildUpdateDescription=$(git log -1 --pretty=%B)"

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: android-v${{ steps.version.outputs.version }}
        path: dist/

  build-ios:
    runs-on: macos-latest
    name: Build iOS

    steps:
    - uses: actions/checkout@v4

    - name: Get version
      id: version
      run: |
        VERSION=$(grep '^version:' WhisperPushApp/pubspec.yaml | head -1 | sed 's/version: *//' | sed 's/+.*//')
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.41.9'
        architecture: x64
        cache: true

    - name: Get dependencies
      working-directory: ./WhisperPushApp
      run: flutter pub get

    - name: Build iOS Simulator Build (without code signing)
      working-directory: ./WhisperPushApp
      run: flutter build ios --simulator --no-codesign

    - name: Package iOS build
      run: |
        mkdir -p dist
        zip -r dist/WhisperPush-v${{ steps.version.outputs.version }}-ios-simulator.zip \
          WhisperPushApp/build/ios/iphonesimulator/Runner.app

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ios-v${{ steps.version.outputs.version }}
        path: dist/

  build-windows:
    runs-on: windows-latest
    name: Build Windows

    steps:
    - uses: actions/checkout@v4

    - name: Get version
      id: version
      shell: pwsh
      run: |
        $content = Get-Content WhisperPushApp/pubspec.yaml | Select-String '^version:'
        $version = ($content -replace 'version:\s*([0-9]+\.[0-9]+\.[0-9]+).*', '$1').Trim()
        echo "version=$version" >> $env:GITHUB_OUTPUT

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.41.9'
        cache: true

    - name: Get dependencies
      working-directory: ./WhisperPushApp
      run: flutter pub get

    - name: Build Windows
      working-directory: ./WhisperPushApp
      run: flutter build windows --release

    - name: Package Windows build
      run: |
        New-Item -ItemType Directory -Force -Path dist
        $pkg = "dist\WhisperPush-v${{ steps.version.outputs.version }}-windows-x64.zip"
        Compress-Archive -Path WhisperPushApp\build\windows\x64\runner\Release\* -DestinationPath $pkg

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: windows-v${{ steps.version.outputs.version }}
        path: dist/

  build-linux:
    runs-on: ubuntu-latest
    name: Build Linux

    steps:
    - uses: actions/checkout@v4

    - name: Get version
      id: version
      run: |
        VERSION=$(grep '^version:' WhisperPushApp/pubspec.yaml | head -1 | sed 's/version: *//' | sed 's/+.*//')
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Install Linux dependencies
      run: |
        sudo apt-get update -y
        sudo apt-get install -y \
          clang cmake git ninja-build pkg-config \
          libgtk-3-dev liblzma-dev libstdc++-12-dev

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.41.9'
        cache: true

    - name: Get dependencies
      working-directory: ./WhisperPushApp
      run: flutter pub get

    - name: Build Linux
      working-directory: ./WhisperPushApp
      run: flutter build linux --release

    - name: Package Linux build
      run: |
        mkdir -p dist
        tar czf dist/WhisperPush-v${{ steps.version.outputs.version }}-linux-x64.tar.gz \
          -C WhisperPushApp/build/linux/x64/release/bundle .

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: linux-v${{ steps.version.outputs.version }}
        path: dist/

  build-macos:
    runs-on: macos-latest
    name: Build macOS

    steps:
    - uses: actions/checkout@v4

    - name: Get version
      id: version
      run: |
        VERSION=$(grep '^version:' WhisperPushApp/pubspec.yaml | head -1 | sed 's/version: *//' | sed 's/+.*//')
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.41.9'
        architecture: x64
        cache: true

    - name: Get dependencies
      working-directory: ./WhisperPushApp
      run: flutter pub get

    - name: Build macOS
      working-directory: ./WhisperPushApp
      run: flutter build macos --release

    - name: Package macOS build
      run: |
        mkdir -p dist
        tar czf dist/WhisperPush-v${{ steps.version.outputs.version }}-macos-x64.tar.gz \
          -C WhisperPushApp/build/macos/Build/Products/Release .

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: macos-v${{ steps.version.outputs.version }}
        path: dist/

  build-web:
    runs-on: ubuntu-latest
    name: Build Web

    steps:
    - uses: actions/checkout@v4

    - name: Get version
      id: version
      run: |
        VERSION=$(grep '^version:' WhisperPushApp/pubspec.yaml | head -1 | sed 's/version: *//' | sed 's/+.*//')
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.41.9'
        cache: true

    - name: Get dependencies
      working-directory: ./WhisperPushApp
      run: flutter pub get

    - name: Build Web
      working-directory: ./WhisperPushApp
      run: flutter build web --release

    - name: Package Web build
      run: |
        mkdir -p dist
        tar czf dist/WhisperPush-v${{ steps.version.outputs.version }}-web.tar.gz \
          -C WhisperPushApp/build/web .

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: web-v${{ steps.version.outputs.version }}
        path: dist/

  publish-release:
    needs: [build-android, build-ios, build-windows, build-linux, build-macos, build-web]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    name: Publish Release

    steps:
    - uses: actions/checkout@v4

    - name: Get version
      id: version
      run: |
        VERSION=$(grep '^version:' WhisperPushApp/pubspec.yaml | head -1 | sed 's/version: *//' | sed 's/+.*//')
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        path: dist
        merge-multiple: true

    - name: List artifacts
      run: ls -la dist/

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        generate_release_notes: true
        files: dist/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}