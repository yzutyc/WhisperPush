name: Build iOS

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.19.0'
        architecture: x64
    
    - name: Get dependencies
      working-directory: ./WhisperPushApp
      run: flutter pub get
    
    - name: Build iOS Simulator Build (without code signing)
      working-directory: ./WhisperPushApp
      run: flutter build ios --simulator --no-codesign
    
    - name: Upload iOS artifact
      uses: actions/upload-artifact@v4
      with:
        name: ios-app
        path: WhisperPushApp/build/ios/iphonesimulator/Runner.app
