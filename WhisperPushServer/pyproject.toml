[project]
name = "whisperpush-server"
version = "0.1.8"
description = "消息推送系统后端服务，基于 FastAPI + SQLAlchemy + PostgreSQL 构建"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "WhisperPush Team", email = "dev@whisperpush.io" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
keywords = ["push", "notifications", "messaging", "fastapi", "websocket"]
dependencies = [
    # Core web framework
    "fastapi>=0.109.0,<0.116.0",
    "uvicorn>=0.27.1,<0.31.0",
    # Database
    "sqlalchemy>=2.0.25,<2.1.0",
    "psycopg2-binary>=2.9.12",
    # Authentication
    "python-jose[cryptography]>=3.3.0,<4.0.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=5.0.0",
    "pyotp>=2.9.0",
    # Configuration
    "pydantic>=2.8.0,<3.0.0",
    "pydantic-settings>=2.14.1",
    "python-dotenv>=1.0.0",
    # HTTP client
    "httpx>=0.28.1",
    "requests>=2.34.0",
    "aiohttp>=3.9.0,<4.0.0",
    # Database migration
    "alembic>=1.12.1,<1.14.0",
    # Email validation
    "email-validator>=2.1.0,<3.0.0",
    # QR Code generation
    "qrcode[pil]>=8.2",
    "pytest>=9.0.3",
]

[project.urls]
"Homepage" = "https://github.com/whisperpush/whisperpush-server"
"Documentation" = "https://docs.whisperpush.io"
"Issues" = "https://github.com/whisperpush/whisperpush-server/issues"

[project.scripts]
whisperpush = "app.main:run_app"

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=4.0.0",
    "flake8>=6.0.0",
    "black>=23.0.0",
]

[tool.pytest.ini_options]
testpaths = ["test"]
addopts = ["-v", "--tb=short"]
pythonpath = ["."]

[tool.coverage.run]
source = ["app"]
omit = [
    "app/__init__.py",
    "app/main.py",
    "app/config.py",
]

[tool.coverage.report]
show_missing = true
fail_under = 80

[tool.flake8]
max-line-length = 120
exclude = [
    "__pycache__",
    ".git",
    "venv",
    ".venv",
    "alembic",
]
ignore = [
    "E501",
    "W503",
]

[tool.black]
line-length = 120
include = "*.py"
exclude = '''
/(
    \.git
  | __pycache__
  | venv
  | \.venv
  | alembic
)/
'''

[tool.setuptools.packages.find]
where = ["."]
exclude = ["alembic*", "test*", "*.tests"]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
